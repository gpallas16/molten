# Molten Shell Window Rules
# Add this to your hyprland.conf with: source = /path/to/molten/hyprland-rules.conf

# ═══════════════════════════════════════════════════════════════
# LAYER SHELL RULES
# ═══════════════════════════════════════════════════════════════

# Main bar panel - animation smoothness is priority
# Blur is disabled because the panel uses dynamic masking which conflicts with blur
# The semi-transparent background provides a frosted glass aesthetic without compositor blur
layerrule = noanim, molten-notch

# Enable blur for the toolbar popup
layerrule = blur, molten-notch
